name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Extract Dobby
        run: |
          if [ -f "dobby-iphoneos-all.tar.gz" ]; then
            tar -xzf dobby-iphoneos-all.tar.gz
            rm dobby-iphoneos-all.tar.gz
          fi
          echo "=== Files after extraction ==="
          ls -la
          echo "=== Looking for .a and .h files ==="
          find . -name "*.a" -o -name "*.h" | head -50

      - name: Compile dylib with clang
        run: |
          DOBBY_LIB=$(find . -name "libdobby.a" | head -1)
          DOBBY_INC=$(find . -name "dobby.h" | head -1 | xargs dirname)
          echo "Dobby lib: $DOBBY_LIB"
          echo "Dobby include: $DOBBY_INC"
          xcrun --sdk iphoneos clang -arch arm64 \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=14.0 \
            -I"$DOBBY_INC" \
            -install_name @executable_path/Frameworks/Stretch.dylib \
            -o Stretch.dylib Tweak.m "$DOBBY_LIB"

      - name: Verify dylib
        run: |
          ls -la Stretch.dylib
          file Stretch.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Stretch-dylib
          path: Stretch.dylib
