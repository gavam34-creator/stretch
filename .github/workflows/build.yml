name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Select a working Xcode
        run: |
          echo "=== Installed Xcodes ==="
          ls -1 /Applications | grep -i xcode || true
          # по умолчанию используем текущий, но если есть 15.x — берём его для стабильности Dobby
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
            echo "Selected Xcode 15.4"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Dobby (static lib, iphoneos arm64)
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cd Dobby && mkdir -p build && cd build
          cmake .. -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_STANDARD=14 \
            -DBUILD_SHARED_LIBS=OFF -DDOBBY_BUILD_EXAMPLES=OFF -DDOBBY_BUILD_TESTS=OFF
          cmake --build . --config Release -j4

      - name: Compile Stretch.dylib
        run: |
          DOBBY_LIB=$(find ./Dobby -name "libdobby.a" | head -1)
          DOBBY_INC=./Dobby/include
          test -f "$DOBBY_LIB" || { echo "libdobby.a missing"; exit 1; }
          test -f "$DOBBY_INC/dobby.h" || { echo "dobby.h missing"; exit 1; }
          xcrun --sdk iphoneos clang -arch arm64 \
            -dynamiclib \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=14.0 \
            -I"$DOBBY_INC" \
            -Wl,-install_name,@executable_path/Frameworks/Stretch.dylib \
            -o Stretch.dylib Tweak.m "$DOBBY_LIB" -lc++

      - name: Verify dylib
        run: |
          ls -la Stretch.dylib
          file Stretch.dylib
          xcrun lipo -info Stretch.dylib

      - name: Package
        run: |
          mkdir -p Stretch-package
          cp Stretch.dylib Stretch-package/
          zip -r Stretch-dylib.zip Stretch.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Stretch-dylib
          path: |
            Stretch.dylib
            Stretch-dylib.zip
