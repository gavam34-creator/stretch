name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -dynamiclib \
            -miphoneos-version-min=16.0 \
            -framework UIKit \
            -framework QuartzCore \
            -framework Foundation \
            -o stretch.dylib \
            Tweak.m

      - name: Sign
        run: codesign --force --sign - stretch.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stretch
          path: stretch.dylib
