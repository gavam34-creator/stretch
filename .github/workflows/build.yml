name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Compile Stretch.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -arch arm64e \
            -dynamiclib \
            -fobjc-arc \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -Wl,-install_name,@executable_path/Frameworks/Stretch.dylib \
            -Wl,-undefined,dynamic_lookup \
            -o Stretch.dylib Tweak.m

      - name: Sign dylib (ldid)
        run: |
          ldid -S Stretch.dylib
          ldid -e Stretch.dylib | head -20 || true

      - name: Verify dylib
        run: |
          ls -la Stretch.dylib
          file Stretch.dylib
          xcrun lipo -info Stretch.dylib

      - name: Package
        run: |
          mkdir -p Stretch-package/Frameworks
          cp Stretch.dylib Stretch-package/Frameworks/
          zip -r Stretch-dylib.zip Stretch.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Stretch-dylib
          path: |
            Stretch.dylib
            Stretch-dylib.zip