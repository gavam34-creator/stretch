name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile dylib with clang
        run: |
          xcrun --sdk iphoneos clang -arch arm64 \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -install_name @executable_path/Frameworks/Stretch.dylib \
            -o Stretch.dylib Tweak.m

      - name: Verify dylib
        run: |
          ls -la Stretch.dylib
          file Stretch.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Stretch-dylib
          path: Stretch.dylib